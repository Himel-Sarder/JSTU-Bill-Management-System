{% extends 'base.html' %}

{% block content %}
<div class="login-container">
  
  <div class="glass-card login-card">

    <!-- Left: Login Image -->
    <div class="login-image">
      <img src="https://i.postimg.cc/cHLWDdT4/Computer-login-rafiki.png" 
           alt="Login Illustration">
    </div>

    <!-- Right: Login Form -->
    <div class="login-form">
      <h2 class="login-title">লগইন</h2>

      <form method="post" class="login-form-fields">
        {% csrf_token %}
        
        <div class="form-group">
          <label class="form-label">ব্যবহারকারীর নাম</label>
          <input type="text" name="username" class="form-input" placeholder="আপনার ব্যবহারকারীর নাম লিখুন">
        </div>

        <div class="form-group">
          <label class="form-label">পাসওয়ার্ড</label>
          <input type="password" name="password" class="form-input" placeholder="আপনার পাসওয়ার্ড লিখুন">
        </div>

        <button type="submit" class="btn login-btn">
          লগইন
        </button>
      </form>

      <p class="register-link">
        একাউন্ট নেই? <a href="{% url 'register' %}" class="register-link-text">রেজিস্টার করুন</a>
      </p>
    </div>

  </div>
</div>

<style>
.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 90vh;
    padding: 20px;
    box-sizing: border-box;
}

.login-card {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
    padding: 40px;
    max-width: 900px;
    width: 100%;
    transition: all 0.3s ease;
}

.login-image {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    min-width: 300px;
    padding: 20px;
}

.login-image img {
    width: 320px;
    height: 320px;
    object-fit: contain;
    transition: all 0.3s ease;
}

.login-form {
    flex: 1;
    min-width: 300px;
    max-width: 400px;
    padding: 20px;
}

.login-title {
    text-align: center;
    color: white;
    margin-bottom: 30px;
    font-size: 28px;
    font-weight: 600;
}

.login-form-fields {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.form-group {
    width: 100%;
}

.form-label {
    color: white;
    display: block;
    margin-bottom: 8px;
    font-size: 16px;
    font-weight: 500;
}

.form-input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: none;
    outline: none;
    font-size: 16px;
    background: rgba(255, 255, 255, 0.9);
    transition: all 0.3s ease;
    box-sizing: border-box;
}

.form-input:focus {
    background: white;
    box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.3);
    transform: translateY(-2px);
}

.form-input::placeholder {
    color: #999;
    font-size: 14px;
}

.login-btn {
    width: 100%;
    background: linear-gradient(45deg, #4ECDC4, #45b7aa);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-weight: 600;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 10px;
    box-shadow: 0 4px 15px rgba(78, 205, 196, 0.3);
}

.login-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(78, 205, 196, 0.4);
    background: linear-gradient(45deg, #45b7aa, #4ECDC4);
}

.login-btn:active {
    transform: translateY(-1px);
}

.register-link {
    text-align: center;
    color: white;
    margin-top: 25px;
    font-size: 16px;
}

.register-link-text {
    color: #4ECDC4;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s ease;
    padding: 4px 8px;
    border-radius: 6px;
}

.register-link-text:hover {
    color: white;
    background: #4ECDC4;
    text-decoration: none;
}

/* Responsive Breakpoints */
@media screen and (max-width: 768px) {
    .login-card {
        padding: 30px 20px;
        flex-direction: column;
    }

    .login-image {
        min-width: 100%;
        padding: 10px 20px 30px;
    }

    .login-image img {
        width: 280px;
        height: 280px;
    }

    .login-form {
        min-width: 100%;
        max-width: 100%;
        padding: 10px;
    }

    .login-title {
        font-size: 24px;
        margin-bottom: 25px;
    }

    .form-input {
        padding: 12px 14px;
    }
}

@media screen and (max-width: 480px) {
    .login-container {
        padding: 10px;
    }

    .login-card {
        padding: 25px 15px;
    }

    .login-image {
        padding: 0 0 20px;
    }

    .login-image img {
        width: 200px;
        height: 200px;
    }

    .login-title {
        font-size: 22px;
        margin-bottom: 20px;
    }

    .form-group {
        margin-bottom: 5px;
    }

    .form-label {
        font-size: 14px;
        margin-bottom: 5px;
    }

    .form-input {
        padding: 10px 12px;
        font-size: 14px;
    }

    .login-btn {
        padding: 12px;
        font-size: 16px;
    }

    .register-link {
        margin-top: 20px;
        font-size: 14px;
    }
}

/* Landscape mode for mobile */
@media screen and (max-width: 768px) and (orientation: landscape) {
    .login-card {
        flex-direction: row;
        padding: 20px;
    }

    .login-image {
        min-width: 40%;
        padding: 10px;
    }

    .login-image img {
        width: 180px;
        height: 180px;
    }

    .login-form {
        min-width: 55%;
        padding: 10px;
    }
}

/* Small height devices */
@media screen and (max-height: 600px) {
    .login-container {
        min-height: auto;
        padding: 15px;
    }

    .login-image img {
        width: 150px;
        height: 150px;
    }

    .login-card {
        padding: 20px;
    }
}

/* Extra small devices */
@media screen and (max-width: 320px) {
    .login-image img {
        width: 150px;
        height: 150px;
    }

    .login-title {
        font-size: 20px;
    }

    .form-input {
        padding: 8px 10px;
    }

    .login-btn {
        padding: 10px;
        font-size: 14px;
    }
}
</style>
{% endblock %}
