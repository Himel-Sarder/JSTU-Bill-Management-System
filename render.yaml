services:
  - type: web
    name: bill-management
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn bill_management.wsgi:application --workers 3 --threads 2 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: bill_management.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: bill_management_db
          property: connectionString
    staticPublishPath: staticfiles


services:
  - type: web
    name: bill-management
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
