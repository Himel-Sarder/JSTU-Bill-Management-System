{% extends 'base.html' %}

{% block content %}
<div class="container" 
     style="display: flex; justify-content: center; align-items: center; min-height: 90vh;">
  
  <div class="glass-card" 
       style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
              background: rgba(255,255,255,0.1); border-radius: 20px; backdrop-filter: blur(10px);
              box-shadow: 0 4px 30px rgba(0,0,0,0.2); padding: 40px; max-width: 900px; width: 100%;">

    <!-- Left: Login Image -->
    <div style="flex: 1; display: flex; justify-content: center; align-items: center; min-width: 300px;">
        <img src="https://i.postimg.cc/cHLWDdT4/Computer-login-rafiki.png" 
             alt="Login Illustration" 
             style="width: 320px; height: 320px; object-fit: contain;">
      </a>
    </div>

    <!-- Right: Login Form -->
    <div style="flex: 1; min-width: 300px; max-width: 400px;">
      <h2 style="text-align: center; color: white; margin-bottom: 30px;">লগইন</h2>

      <form method="post" style="display: flex; flex-direction: column; gap: 20px;">
        {% csrf_token %}
        
        <div>
          <label style="color: white; display: block; margin-bottom: 5px;">ব্যবহারকারীর নাম</label>
          <input type="text" name="username" 
                 style="width: 100%; padding: 12px; border-radius: 10px; border: none; outline: none;">
        </div>

        <div>
          <label style="color: white; display: block; margin-bottom: 5px;">পাসওয়ার্ড</label>
          <input type="password" name="password" 
                 style="width: 100%; padding: 12px; border-radius: 10px; border: none; outline: none;">
        </div>

        <button type="submit" class="btn" 
                style="width: 100%; background-color: #4ECDC4; color: white; border: none;
                       border-radius: 10px; padding: 12px; font-weight: bold; cursor: pointer;">
          লগইন
        </button>
      </form>

      <p style="text-align: center; color: white; margin-top: 20px;">
        একাউন্ট নেই? <a href="{% url 'register' %}" style="color: #4ECDC4;">রেজিস্টার করুন</a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
